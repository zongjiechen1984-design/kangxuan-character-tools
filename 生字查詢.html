<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>康軒生字查詢</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2428;
      --muted: #6a747a;
      --line: #cfd8dc;
      --paper: #fbfbf8;
      --panel: #ffffff;
      --accent: #2f675f;
      --accent-soft: #e8f2ef;
      --warn: #a94839;
      --shadow: 0 14px 35px rgba(34, 45, 52, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(47, 103, 95, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(47, 103, 95, 0.05) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 22px;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 10px;
      font-size: 16px;
    }

    .scope {
      text-align: right;
      color: var(--accent);
      font-weight: 800;
      line-height: 1.7;
      white-space: nowrap;
    }

    .search-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px;
      border-radius: 8px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }

    input {
      width: 100%;
      border: 2px solid #243236;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 26px;
      font-family: "DFKai-SB", "KaiTi", "Microsoft JhengHei", sans-serif;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      min-height: 58px;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button.secondary {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      min-height: 38px;
      padding: 0 13px;
      font-size: 16px;
    }

    .summary {
      margin: 20px 0 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(34, 45, 52, 0.06);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .char-box {
      display: grid;
      grid-template-columns: 74px 34px;
      align-items: center;
      gap: 4px;
    }

    .tianzi {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      position: relative;
      border: 2px solid #1b2024;
      font-size: 46px;
      font-family: "DFKai-SB", "KaiTi", serif;
      line-height: 1;
      background: #fff;
    }

    .tianzi::before,
    .tianzi::after {
      content: "";
      position: absolute;
      background: var(--line);
    }

    .tianzi::before {
      width: 1px;
      height: 100%;
      left: 50%;
      top: 0;
    }

    .tianzi::after {
      height: 1px;
      width: 100%;
      left: 0;
      top: 50%;
    }

    .bpmf {
      min-height: 74px;
      display: grid;
      grid-template-columns: 21px 13px;
      justify-content: center;
      align-items: center;
      column-gap: 0;
      color: #111;
      font-weight: 1000;
    }

    .bpmf-main {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 21px;
      line-height: 1;
      font-weight: 1000;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .bpmf-tone {
      font-size: 18px;
      font-weight: 1000;
      line-height: 1;
      min-height: 58px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .bpmf.blank {
      grid-template-columns: 1fr;
      font-size: 24px;
    }

    .lesson {
      text-align: right;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.45;
    }

    .order {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .meta {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfdfc;
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .meta-value {
      margin-top: 4px;
      font-weight: 900;
      font-size: 18px;
      min-height: 24px;
    }

    .info-block {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fbfdfc;
    }

    .info-block.warning {
      border-color: #e7c6be;
      background: #fff8f6;
    }

    .info-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .term-list,
    .confusion-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .term-chip,
    .confusion-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
      padding: 5px 10px;
    }

    .confusion-chip {
      border-color: #d9b0a8;
      color: var(--warn);
    }

    .not-found {
      border-color: #e7c6be;
      background: #fff8f6;
    }

    .not-found .lesson {
      color: var(--warn);
    }

    .lesson-list {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    details {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }

    summary {
      cursor: pointer;
      font-weight: 900;
      color: var(--accent);
    }

    .word-strip {
      margin-top: 10px;
      line-height: 2;
      font-size: 18px;
    }

    .word-strip span {
      display: inline-block;
      margin-right: 10px;
      white-space: nowrap;
    }

    @media (max-width: 680px) {
      header,
      .search-row {
        grid-template-columns: 1fr;
      }

      .scope {
        text-align: left;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>生字查詢</h1>
        <div class="subtitle">輸入一個或多個國字，查詢康軒已整理生字是否學過。</div>
      </div>
      <div class="scope">康軒一下 L1-L12<br>二上 L1-L3</div>
    </header>

    <section class="search-panel">
      <div class="search-row">
        <input id="query" type="text" autocomplete="off" placeholder="例：生升珍珠雲" autofocus>
        <button id="searchBtn" type="button">查詢</button>
        <button id="clearBtn" class="secondary" type="button">清除</button>
      </div>
      <div class="hint">可一次輸入多個字；重複字會自動合併。二上內容會陸續加入，目前先收錄 L1-L3。</div>
      <div class="chips" aria-label="常混字快速查詢">
        <button class="chip" type="button" data-query="生升">生 / 升</button>
        <button class="chip" type="button" data-query="珍珠">珍 / 珠</button>
        <button class="chip" type="button" data-query="游遊">游 / 遊</button>
        <button class="chip" type="button" data-query="清情晴">清 / 情 / 晴</button>
        <button class="chip" type="button" data-query="日目">日 / 目</button>
        <button class="chip" type="button" data-query="年希望">二上 L1</button>
        <button class="chip" type="button" data-query="餐蛋煎">二上 L2</button>
        <button class="chip" type="button" data-query="巷牆貓">二上 L3</button>
      </div>
    </section>

    <div id="summary" class="summary">請輸入要查的生字。</div>
    <section id="results" class="results"></section>
    <section id="lessonList" class="lesson-list"></section>
  </main>

      船:"小船", 港:"港口", 口:"門口", 把:"一把", 脫:"脫鞋", 靠:"靠岸", 像:"好像", 享:"享受", 受:"接受", 暖:"溫暖",
      院:"院子", 種:"種子", 它:"它們", 需:"需要", 陽:"太陽", 澆:"澆水", 問:"問好", 怎:"怎麼", 長:"長大",
      早:"早上", 跟:"跟著", 他:"他們", 拿:"拿起", 卡:"卡片", 片:"一片", 給:"送給", 寫:"寫字", 喜:"喜歡", 您:"您好",
      己:"自己", 自:"自己", 躺:"躺下", 夢:"作夢", 作:"作文", 黑:"黑色", 糖:"棉花糖", 棉:"棉花", 成:"變成", 變:"變化", 亮:"明亮", 漂:"漂亮", 更:"更加", 得:"覺得", 鵝:"白鵝",
      滴:"水滴", 穿:"穿上", 雙:"一雙", 雨:"下雨", 妹:"妹妹", 珠:"珍珠", 珍:"珍貴", 顆:"一顆", 戲:"遊戲", 遊:"遊戲", 金:"金魚", 缸:"魚缸", 魚:"小魚", 面:"水面", 落:"落下", 游:"游泳",
      掃:"打掃", 國:"國家", 太:"太陽", 虹:"彩虹", 彩:"色彩", 低:"低頭", 馬:"馬路", 淨:"乾淨", 洗:"洗手", 除:"除草", 認:"認字", 很:"很好", 葉:"樹葉", 樹:"大樹", 刷:"刷子", 送:"送給",
      風:"風箏", 線:"毛線", 趣:"有趣", 化:"變化", 地:"草地", 跑:"跑步", 奇:"神奇", 神:"神奇", 升:"升起", 等:"等待", 事:"事情", 件:"一件", 每:"每天", 笑:"笑臉", 跳:"跳高", 情:"心情",
      時:"時間", 記:"記得", 今:"今天", 日:"生日", 生:"生日", 收:"收到", 學:"學校", 嗎:"好嗎", 道:"知道", 知:"知道", 次:"一次", 第:"第一", 福:"祝福", 祝:"祝福", 張:"一張", 謝:"謝謝",
      半:"半點", 點:"一點", 前:"前面", 燈:"電燈", 想:"想念", 息:"休息", 休:"休息", 停:"停止", 楚:"清楚", 清:"清楚", 油:"加油", 加:"加油", 幫:"幫忙", 吧:"好吧", 兒:"兒子", 慢:"慢慢",
      年:"新年", 希:"希望", 望:"希望", 坐:"座位", 位:"座位", 本:"本子", 大:"大家", 淡:"淡水", 書:"書本", 老:"老師", 師:"老師", 以:"以為", 為:"以為", 故:"故事", 用:"用力", 力:"力氣", 只:"只有", 現:"現在", 還:"還有", 矮:"矮小",
      餐:"早餐", 全:"全部", 蛋:"雞蛋", 煎:"煎蛋", 圓:"圓形", 番:"番茄", 茄:"番茄", 切:"切片", 輪:"一輪", 保:"保持", 城:"城堡", 方:"方形", 中:"中間", 吐:"吐司", 夾:"夾心", 司:"吐司", 接:"接著", 醬:"果醬", 畫:"畫畫", 臉:"笑臉",
      巷:"小巷", 叔:"叔叔", 牆:"牆上", 貓:"小貓", 屋:"屋子", 捧:"捧花", 蝴:"蝴蝶", 蝶:"蝴蝶", 忙:"幫忙", 娶:"娶親", 娘:"新娘", 黃:"黃花", 筆:"毛筆", 打:"打扮", 扮:"打扮", 模:"模樣", 樣:"模樣", 美:"美麗", 麗:"美麗", 越:"越過"
    };

    const confusionHints = {
      生:["升"], 升:["生"], 珍:["珠"], 珠:["珍"], 游:["遊"], 遊:["游"],
      清:["情","晴"], 情:["清","晴"], 晴:["清","情"], 日:["目"], 目:["日"],
      己:["已","巳"], 自:["白","目"], 低:["底"], 作:["做"], 坐:["座"],
      園:["圓"], 圓:["園"], 馬:["媽","嗎"], 嗎:["媽","馬"], 亮:["高"],
      休:["体"], 後:["候"], 只:["隻"], 他:["她"], 它:["他"], 的:["地","得"]
    };

    const index = new Map();
    lessons.forEach(lesson => {
      lesson.words.forEach(([char, zhuyin, radical = "待補", strokes = "待補"], i) => {
        if (!index.has(char)) index.set(char, []);
        index.get(char).push({
          char,
          zhuyin,
          radical,
          strokes,
          book: lesson.book || "一下",
          lesson: lesson.lesson,
          title: lesson.title,
          order: i + 1
        });
      });
    });

    const queryEl = document.getElementById("query");
    const resultsEl = document.getElementById("results");
    const summaryEl = document.getElementById("summary");
    const lessonListEl = document.getElementById("lessonList");

    function uniqueChars(text) {
      return [...new Set([...text].filter(ch => /\p{Script=Han}/u.test(ch)))];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function splitZhuyin(value) {
      const match = String(value).match(/^(.+?)([ˊˇˋ˙])?$/);
      return {
        symbols: match ? match[1] : value,
        tone: match?.[2] || ""
      };
    }

    function zhuyinHtml(value, blank = false) {
      if (blank) return `<div class="bpmf blank">?</div>`;
      const parts = splitZhuyin(value);
      return `
        <div class="bpmf">
          <span class="bpmf-main">${parts.symbols}</span>
          <span class="bpmf-tone">${parts.tone}</span>
        </div>
      `;
    }

    function termsFor(char) {
      const terms = new Set();
      if (termHints[char]) terms.add(termHints[char]);
      Object.values(termHints).forEach(term => {
        if (term.includes(char)) terms.add(term);
      });
      return [...terms].slice(0, 3);
    }

    function termBlock(char) {
      const terms = termsFor(char);
      if (terms.length === 0) return "";
      return `
        <div class="info-block">
          <div class="info-label">語詞例子</div>
          <div class="term-list">${terms.map(term => `<span class="term-chip">${escapeHtml(term)}</span>`).join("")}</div>
        </div>
      `;
    }

    function confusionBlock(char) {
      const hints = confusionHints[char] || [];
      if (hints.length === 0) return "";
      return `
        <div class="info-block warning">
          <div class="info-label">相似字提醒</div>
          <div class="confusion-list">${hints.map(hint => `<span class="confusion-chip">${escapeHtml(char)} / ${escapeHtml(hint)}</span>`).join("")}</div>
        </div>
      `;
    }

    function resultCard(item) {
      return `
        <article class="card">
          <div class="card-head">
            <div class="char-box">
              <div class="tianzi">${item.char}</div>
              ${zhuyinHtml(item.zhuyin)}
            </div>
            <div class="lesson">${item.book} L${item.lesson}<br>${item.title}</div>
          </div>
          <div class="order">生字順序：第 ${item.order} 個</div>
          <div class="meta-grid">
            <div class="meta">
              <div class="meta-label">部首</div>
              <div class="meta-value">${item.radical}</div>
            </div>
            <div class="meta">
              <div class="meta-label">總筆畫</div>
              <div class="meta-value">${item.strokes}</div>
            </div>
            <div class="meta">
              <div class="meta-label">冊別</div>
              <div class="meta-value">${item.book}</div>
            </div>
          </div>
          ${termBlock(item.char)}
          ${confusionBlock(item.char)}
        </article>
      `;
    }

    function notFoundCard(char) {
      return `
        <article class="card not-found">
          <div class="card-head">
            <div class="char-box">
              <div class="tianzi">${char}</div>
              ${zhuyinHtml("", true)}
            </div>
            <div class="lesson">尚未收錄</div>
          </div>
          <div class="order">目前已整理的生字表查不到這個字。</div>
        </article>
      `;
    }

    function search() {
      const chars = uniqueChars(queryEl.value.trim());
      if (chars.length === 0) {
        summaryEl.textContent = "請輸入要查的生字。";
        resultsEl.innerHTML = "";
        return;
      }

      const cards = [];
      let foundCount = 0;
      chars.forEach(char => {
        const items = index.get(char);
        if (items) {
          foundCount += 1;
          items.forEach(item => cards.push(resultCard(item)));
        } else {
          cards.push(notFoundCard(char));
        }
      });

      summaryEl.textContent = `查詢 ${chars.length} 個字，找到 ${foundCount} 個已學過的字。`;
      resultsEl.innerHTML = cards.join("");
    }

    function renderLessonList() {
      lessonListEl.innerHTML = lessons.map(lesson => {
        const book = lesson.book || "一下";
        const words = lesson.words.map(([char, zhuyin, radical = "待補", strokes = "待補"]) => `<span>${char} ${zhuyin}（${radical}／${strokes}畫）</span>`).join("");
        return `
          <details>
            <summary>${book} L${lesson.lesson} ${lesson.title}</summary>
            <div class="word-strip">${words}</div>
          </details>
        `;
      }).join("");
    }

    document.getElementById("searchBtn").addEventListener("click", search);
    document.getElementById("clearBtn").addEventListener("click", () => {
      queryEl.value = "";
      search();
      queryEl.focus();
    });
    document.querySelectorAll(".chip").forEach(button => {
      button.addEventListener("click", () => {
        queryEl.value = button.dataset.query;
        search();
      });
    });
    queryEl.addEventListener("input", search);
    queryEl.addEventListener("keydown", event => {
      if (event.key === "Enter") search();
    });

    renderLessonList();
  </script>
</body>
</html>
